# Render Blueprint for helpdock.flisk.sh on free plans: render.com → New → Blueprint → flisk-sh/helpdock.
# The database is a free Neon Postgres (https://neon.tech): Render asks for DATABASE_URL when the Blueprint is created;
# paste Neon's direct connection string (it ends in ?sslmode=require). See DEPLOY.md.
# No model and no API key: answers quote the docs, and visitors take them to their own AI (buttons, or /mcp).
#
# Free web services sleep after 15 idle minutes (the next visit waits about a minute) and have no pre-deploy command,
# so the container applies migrations itself on every start (`start` in the Dockerfile).
services:
  - type: web
    name: helpdock
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /ready
    domains:
      - helpdock.flisk.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HELPDOCK_PUBLIC_URL
        value: https://helpdock.flisk.sh/
      - key: HELPDOCK_PROXY
        value: last-forwarded
      - key: HELPDOCK_TURNS_PER_HOUR
        value: "60"
      - key: HELPDOCK_ADMIN_TOKEN
        generateValue: true
