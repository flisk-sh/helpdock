# Render Blueprint for helpdock.flisk.sh on free plans: render.com → New → Blueprint → flisk-sh/helpdock.
# Nothing else to sign up for: no database (the agent uses Bun's built-in SQLite when DATABASE_URL is not set) and no
# AI key (answers quote the docs; visitors take them to their own AI with the buttons or /mcp). See DEPLOY.md.
#
# Free web services sleep after 15 idle minutes (the next visit waits about a minute). The built-in database is in
# memory: the starter pages load again on every start, while pages added with POST /docs and chat history last only
# until the next sleep. To keep them, add DATABASE_URL with your own Postgres (Neon or any other) in the dashboard.
services:
  - type: web
    name: helpdock
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /ready
    domains:
      - helpdock.flisk.sh
    envVars:
      - key: HELPDOCK_PUBLIC_URL
        value: https://helpdock.flisk.sh/
      - key: HELPDOCK_PROXY
        value: last-forwarded
      - key: HELPDOCK_TURNS_PER_HOUR
        value: "60"
      - key: HELPDOCK_ADMIN_TOKEN
        generateValue: true
