# Local stand-in for a managed queue (SQS / Pub/Sub / Service Bus): NATS JetStream.
#
# Flisk loads this file when it exists (engine: infra-loader.star). It does not
# generate it. Names are fixed by Flisk: the container must be called
# <project>_nats (that is the host in TILT_NATS_URL), and the `redis` service
# must exist because Flisk registers both.
services:
  nats:
    image: nats:2.10-alpine
    container_name: helpdock_nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    restart: unless-stopped
    volumes:
      - helpdock_nats_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Registered by Flisk but never started (auto_init=False). Kept so the file loads.
  redis:
    image: redis:7-alpine
    container_name: helpdock_redis
    restart: unless-stopped
    networks:
      - backend

volumes:
  helpdock_nats_data:

networks:
  backend:
    name: helpdock_backend
    external: true
