# helpdock.flisk.si while the Render service is suspended: redirects to flisk.sh. Deploy: bunx wrangler@4 deploy (from this folder).
# The custom domain needs no DNS record of its own, but the hostname must have none: delete the CNAME
# helpdock -> helpdock.onrender.com in zone flisk.si first (Cloudflare error 100117 otherwise).
name = "helpdock-paused"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "helpdock.flisk.si", custom_domain = true }]
workers_dev = true
preview_urls = false
