# Deterministic checks on every push and pull request, like flisk's scoreboard gates: the agent's typecheck and its
# tests, including tests/render-fixtures.test.ts, which runs real pages (the Flisk README, an HTML-heavy docs page)
# through the whole pipeline and fails if any comes out with HTML shown as text, anything executable, or HTML in the
# search text. Offline: the fixtures are committed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agents/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun x --bun tsc --noEmit -p .
      - name: Tests (unit, injection, render fixtures)
        run: bun x --bun vitest run

  image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t helpdock-ci .
      - name: Start with no database and answer
        run: |
          docker run -d --name hd -p 18090:10000 helpdock-ci
          for i in $(seq 1 30); do curl -sf localhost:18090/ready && break; sleep 2; done
          curl -sf -X POST localhost:18090/turn -H 'x-session-id: ci' -H 'content-type: application/json' \
            -d '{"input":"port already in use"}' | grep -q '"sources":\[{'
          docker logs hd
